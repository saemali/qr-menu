<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Chai Corner · Table card</title>
<style>
@page{size:105mm 148mm;margin:8mm}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:system-ui,"Noto Sans",sans-serif;color:#1a1a1a;background:#fff}
.card{width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0;gap:4mm}
h1{margin:0;font-size:18pt;color:#0f5c46;line-height:1.2}
.local{margin:0;font-size:12pt;color:#5c5348}
.qr{width:38mm;height:38mm;object-fit:contain}
.scan{margin:0;font-size:11pt;font-weight:600;letter-spacing:.02em}
.sub{margin:0;font-size:8pt;color:#5c5348}
</style>
<link rel="stylesheet" href="../assets/card.css">
</head><body>
<div class="card">
  <h1>Chai Corner</h1>
  <p class="local">चाय कॉर्नर</p>
  <img class="qr" src="qr.png" alt="QR code for menu">
  <p class="scan">Scan for menu</p>
  <p class="sub">saemali.github.io/qr-menu/chai-corner/</p>
  <p class="sub">Demo · fictional sample restaurant</p>
</div>
</body></html>
